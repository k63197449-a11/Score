name: 123

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js & Python
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        npm install axios
        pip install gTTS

    - name: Fetch Current Score
      run: |
        node fetch-score.js

    - name: Generate Bangla Voice
      run: |
        python -c "from gtts import gTTS; text = open('score.txt', 'r').read(); tts = gTTS(text=text, lang='bn'); tts.save('commentary.mp3')"

    - name: Render 15-Sec Video & Push to YouTube
      env:
        YT_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      run: |
        # এখানে ফিল্টারের শেষে ,format=yuv420p যোগ করা হয়েছে যা প্রোফাইল এররটি ফিক্স করবে
        ffmpeg -f lavfi -i "testsrc=size=1080x1920:rate=30,format=yuv420p" \
        -stream_loop -1 -i commentary.mp3 \
        -vf "geq=r='12+sin(2*PI*X/W+T)*15':g='20+cos(2*PI*Y/H+T)*15':b='40+sin(T)*10',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=score.txt:x=(w-tw)/2:y=(h-th)/2:fontcolor=white:fontsize=40:box=1:boxcolor=black@0.7:boxborderw=20,format=yuv420p" \
        -c:v libx264 -profile:v main -preset fast -b:v 2500k -t 15 \
        -c:a aac -b:a 128k -ar 44100 \
        -f flv "rtmp://a.rtmp.youtube.com/live2/$YT_STREAM_KEY"
