name: 123

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  realtime-stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Auto Clean Git Garbage & Cache
      run: |
        echo "Cleaning up repository cache and junk..."
        git gc --prune=now
        git clean -fdx || true
        rm -f score.txt commentary.mp3 || true

    - name: Setup Node.js & Python
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        npm install axios
        pip install edge-tts

    - name: Run Realtime Live Engine
      env:
        YT_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      run: |
        # বাংলা লেখা সরাসরি কম্যান্ডে না দিয়ে প্রথমে ফাইলে সেভ করা হচ্ছে (এরর এড়ানোর জন্য)
        echo "খেলা শুরু হতে যাচ্ছে, একটু অপেক্ষা করুন।" > score.txt
        
        # ফাইল থেকে রিড করার জন্য --file অপশন ব্যবহার করা হলো
        edge-tts --voice bn-IN-PradeepNeural --file score.txt --write-media commentary.mp3
        
        # আমাদের রিয়েলটাইম পাইথন ইঞ্জিন চালু করা
        python stream.py

    - name: Final Wipe Out
      if: always()
      run: |
        echo "Final cleanup before job ends..."
        rm -rf *.mp3 *.txt node_modules package-lock.json || true
