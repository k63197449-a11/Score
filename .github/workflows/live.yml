on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js & Python
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies & gTTS
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        npm install axios
        pip install gTTS

    - name: Fetch Live Score
      run: |
        node fetch-score.js

    - name: Generate Voice Commentary (TTS)
      run: |
        # score.txt ফাইলের লেখাটিকে বাংলায় মুখে বলার জন্য অডিও ফাইলে রূপান্তর করবে
        python -c "from gtts import gTTS; text = open('score.txt', 'r').read(); tts = gTTS(text=text, lang='bn'); tts.save('commentary.mp3')"

    - name: Start Live Stream to YouTube
      env:
        YT_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      run: |
        # ৯:১৬ ভিডিও এবং কোডের তৈরি করা বাংলা ভয়েস একসাথে ব্লেন্ড করে লাইভ স্ট্রিম
        ffmpeg -re -stream_loop -1 -i bg-video.mp4 -stream_loop -1 -i commentary.mp3 \
        -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=score.txt:x=(w-tw)/2:y=h-300:fontcolor=white:fontsize=36:box=1:boxcolor=black@0.6:boxborderw=10,scale=1080:1920" \
        -c:v libx264 -profile:v main -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
        -c:a aac -b:a 128k -ar 44100 \
        -f flv "rtmp://a.rtmp.youtube.com/live2/$YT_STREAM_KEY"
