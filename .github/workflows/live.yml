name: 123

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  realtime-stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js & Python
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        npm install axios
        pip install edge-tts

    - name: Run Realtime Live Engine
      env:
        YT_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      run: |
        # প্রথমবার রান হওয়ার জন্য একটি বেসিক ফাইল তৈরি করে রাখা
        echo "লাইভ স্কোর লোড হচ্ছে..." > score.txt
        edge-tts --voice bn-IN-PradeepNeural --text "লাইভ স্কোর লোড হচ্ছে" --write-media commentary.mp3
        
        # আমাদের রিয়েলটাইম পাইথন ইঞ্জিন চালু করা
        python stream.py
