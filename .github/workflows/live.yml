name: 123 

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  realtime-stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Auto Clean Git Garbage & Cache
      run: |
        echo "Cleaning up repository cache and junk..."
        git gc --prune=now
        git clean -fdx || true
        rm -f score.txt commentary.mp3 || true

    - name: Setup Node.js & Python
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        npm install axios
        pip install gTTS

    - name: Run Realtime Live Engine
      env:
        YT_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      run: |
        # শুরুতে একটি ডিফল্ট ফাইল তৈরি করে রাখা হচ্ছে
        echo "Live score is updating..." > score.txt
        
        # প্রথমবার রান হওয়ার জন্য একটি বেসিক ভয়েস ফাইল জেনারেট করা
        python -c "from gtts import gTTS; text = open('score.txt', 'r').read(); tts = gTTS(text=text, lang='en'); tts.save('commentary.mp3')"
        
        # আমাদের রিয়েলটাইম পাইথন ইঞ্জিন চালু করা
        python stream.py

    - name: Final Wipe Out
      if: always()
      run: |
        echo "Final cleanup before job ends..."
        rm -rf *.mp3 *.txt node_modules package-lock.json || true
